[project]
name = "ai-support-platform"
version = "0.1.0"
description = "Enterprise AI Customer Support Platform"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "AI Support Platform Team", email = "team@ai-support-platform.com"}
]
keywords = ["ai", "customer-support", "rag", "llm", "fastapi", "saas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.1.18",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pydantic-extra-types>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "openai>=1.12.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.0.30",
    "langchain-text-splitters>=0.0.2",
    "chromadb>=0.4.22",
    "pgvector>=0.2.5",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    "pytz>=2024.1",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.19.0",
    "slowapi>=0.1.9",
    "aiofiles>=23.2.1",
    "python-magic>=0.4.27",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.3",
    "markdown>=3.6.0",
    "tenacity>=8.2.3",
    "aiosmtplib>=3.0.0",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.26.0",
    "faker>=25.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.2.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "isort>=5.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PYI", "PT", "Q", "RUF", "PL", "TRY", "NPY", "PD", "PGH", "PIE", "TID", "TCH", "PTH", "ERA", "RET", "LOG", "ARG", "PERF", "ISC", "ICN", "DTZ", "EXE", "PLE", "PLW", "RSE"]
ignore = ["E501", "B008", "C901", "PLE1205", "PLW0603"]
exclude = [".venv", "dist", "build", ".mypy_cache", ".ruff_cache", ".pytest_cache", "*.egg-info", "__pycache__", ".git", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.black]
line-length = 100
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = """
^(
  \\.venv
  |\\.mypy_cache
  |\\.ruff_cache
  |\\.pytest_cache
  |dist
  |build
  |\\.git
  |node_modules
  |.*\\.egg-info
  |__pycache__
)/
"""

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = false
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
no_error_summary = false

[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "alembic.*", "pytest.*", "faker.*", "factory.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "slow: Slow tests",
    "ai: AI-related tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "alembic/*", "migrations/*", "src/app/main.py", "src/app/**/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv", "dist", "build", ".mypy_cache", ".ruff_cache", ".pytest_cache", "*.egg-info", "__pycache__", ".git", "node_modules"]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"